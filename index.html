<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waterle</title>
<style>
  :root {
    --bg: #f4f7fa;
    --fg: #1d2833;
    --muted: #7a8894;
    --glass: #c9d6e2;
    --ok: #2fa864;
    --bad: #d9534f;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101519;
      --fg: #e8eef3;
      --muted: #7f8c98;
      --glass: #3a4a58;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 500 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    padding: 0 1rem;
  }
  #glass {
    width: min(80vw, 300px);
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    background: var(--glass);
  }
  #buttons {
    display: flex;
    gap: 1rem;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--fg);
    background: transparent;
    border: 2px solid currentColor;
    border-radius: 999px;
    padding: 0.75em 1.6em;
    cursor: pointer;
    transition: transform 0.08s, opacity 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; transform: none; }
  #result {
    font-size: 3rem;
    line-height: 1;
    height: 3rem;
    font-weight: 700;
  }
  #result.ok { color: var(--ok); }
  #result.bad { color: var(--bad); }
  #history {
    display: flex;
    gap: 0.5rem;
    height: 0.6rem;
  }
  #history span {
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: var(--ok);
    animation: pop 0.18s ease-out;
  }
  #history span.bad { background: var(--bad); }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  #result.show { animation: pop 0.18s ease-out; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  #glass.new { animation: fade 0.25s ease-out; }
</style>
</head>
<body>
  <h1>Can you guess what type of water this is?</h1>

  <img id="glass" alt="glass of water">

  <div id="result" aria-live="polite"></div>

  <div id="buttons">
    <button id="tap">Tap water</button>
    <button id="not">Mineral water</button>
  </div>

  <div id="history" aria-label="last 10 results"></div>

<script>
  const glass = document.getElementById('glass');
  const result = document.getElementById('result');
  const hist = document.getElementById('history');
  const buttons = [...document.querySelectorAll('button')];

  let busy = false;

  const PHOTOS = Array.from({ length: 20 }, (_, i) => `img/${String(i + 1).padStart(2, '0')}.jpg`);
  let current = -1, next = pick();

  function pick() {
    let i;
    do i = Math.floor(Math.random() * PHOTOS.length); while (i === current);
    const img = new Image();
    img.src = PHOTOS[i];
    return { i, img };
  }

  function newGlass() {
    current = next.i;
    glass.src = next.img.src;
    next = pick(); // preload the following photo

    glass.classList.remove('new');
    void glass.offsetWidth; // restart animation
    glass.classList.add('new');
  }

  function guess() {
    if (busy) return;
    busy = true;
    buttons.forEach(b => b.disabled = true);

    const win = Math.random() < 0.5;

    result.textContent = win ? '✓' : '✗';
    result.className = (win ? 'ok' : 'bad') + ' show';
    const dot = document.createElement('span');
    if (!win) dot.className = 'bad';
    hist.appendChild(dot);
    while (hist.children.length > 10) hist.firstChild.remove();

    setTimeout(() => {
      result.textContent = '';
      result.className = '';
      newGlass();
      buttons.forEach(b => b.disabled = false);
      busy = false;
    }, 900);
  }

  buttons.forEach(b => b.addEventListener('click', guess));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === '1') guess();
    if (e.key === 'ArrowRight' || e.key === '2') guess();
  });

  newGlass();
</script>
</body>
</html>
