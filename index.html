<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waterle</title>
<style>
  :root {
    --bg: #f4f7fa;
    --fg: #1d2833;
    --muted: #7a8894;
    --glass: #c9d6e2;
    --water: #6fb4e8;
    --ok: #2fa864;
    --bad: #d9534f;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101519;
      --fg: #e8eef3;
      --muted: #7f8c98;
      --glass: #3a4a58;
      --water: #4f9bd6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 500 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  #glass {
    width: min(50vw, 220px);
    height: auto;
    display: block;
  }
  #buttons {
    display: flex;
    gap: 1rem;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--fg);
    background: transparent;
    border: 2px solid currentColor;
    border-radius: 999px;
    padding: 0.75em 1.6em;
    cursor: pointer;
    transition: transform 0.08s, opacity 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; transform: none; }
  #result {
    font-size: 3rem;
    line-height: 1;
    height: 3rem;
    font-weight: 700;
  }
  #result.ok { color: var(--ok); }
  #result.bad { color: var(--bad); }
  #history {
    display: flex;
    gap: 0.5rem;
    height: 0.6rem;
  }
  #history span {
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: var(--ok);
    animation: pop 0.18s ease-out;
  }
  #history span.bad { background: var(--bad); }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  #result.show { animation: pop 0.18s ease-out; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  #glass.new { animation: fade 0.25s ease-out; }
</style>
</head>
<body>
  <svg id="glass" viewBox="0 0 120 180" aria-label="glass of water">
    <defs>
      <clipPath id="clip">
        <path d="M20 12 L100 12 L92 168 Q60 176 28 168 Z"/>
      </clipPath>
    </defs>
    <!-- water -->
    <g clip-path="url(#clip)">
      <rect id="water" x="0" y="70" width="120" height="120" fill="var(--water)"/>
      <ellipse id="surface" cx="60" cy="70" rx="40" ry="5" fill="#fff" opacity="0.35"/>
      <g id="bubbles" fill="#fff" opacity="0.5"></g>
    </g>
    <!-- glass outline -->
    <path d="M20 12 L100 12 L92 168 Q60 176 28 168 Z"
          fill="none" stroke="var(--glass)" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="60" cy="12" rx="40" ry="6" fill="none" stroke="var(--glass)" stroke-width="4"/>
    <!-- highlight -->
    <path d="M30 30 Q28 90 32 150" fill="none" stroke="#fff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  </svg>

  <div id="result" aria-live="polite"></div>

  <div id="buttons">
    <button id="tap">Tap water</button>
    <button id="not">Mineral water</button>
  </div>

  <div id="history" aria-label="last 10 results"></div>

<script>
  const glass = document.getElementById('glass');
  const water = document.getElementById('water');
  const surface = document.getElementById('surface');
  const bubbles = document.getElementById('bubbles');
  const result = document.getElementById('result');
  const hist = document.getElementById('history');
  const buttons = [...document.querySelectorAll('button')];

  let busy = false;

  function rand(min, max) { return min + Math.random() * (max - min); }

  // Every glass looks slightly different so it feels like a new picture.
  function newGlass() {
    const level = rand(40, 95);
    water.setAttribute('y', level);
    surface.setAttribute('cy', level);
    // Very faint tint so the "clue" is meaningless but tempting.
    const tint = rand(-8, 8);
    water.style.filter = `hue-rotate(${tint}deg) saturate(${rand(0.85, 1.15)})`;

    bubbles.innerHTML = '';
    const n = Math.floor(rand(0, 9));
    for (let i = 0; i < n; i++) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', rand(32, 88));
      c.setAttribute('cy', rand(level + 10, 160));
      c.setAttribute('r', rand(1, 3));
      bubbles.appendChild(c);
    }

    glass.classList.remove('new');
    void glass.offsetWidth; // restart animation
    glass.classList.add('new');
  }

  function guess() {
    if (busy) return;
    busy = true;
    buttons.forEach(b => b.disabled = true);

    const win = Math.random() < 0.5;

    result.textContent = win ? '✓' : '✗';
    result.className = (win ? 'ok' : 'bad') + ' show';
    const dot = document.createElement('span');
    if (!win) dot.className = 'bad';
    hist.appendChild(dot);
    while (hist.children.length > 10) hist.firstChild.remove();

    setTimeout(() => {
      result.textContent = '';
      result.className = '';
      newGlass();
      buttons.forEach(b => b.disabled = false);
      busy = false;
    }, 900);
  }

  buttons.forEach(b => b.addEventListener('click', guess));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === '1') guess();
    if (e.key === 'ArrowRight' || e.key === '2') guess();
  });

  newGlass();
</script>
</body>
</html>
